# 域名已配置为 wusan-ai.store；在对应证书文件就绪后启用。
server {
    listen 80;
    server_name wusan-ai.store;

    # 供证书工具的 HTTP-01 webroot 验证使用。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://wusan-ai.store$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wusan-ai.store;
    ssl_certificate /etc/letsencrypt/live/wusan-ai.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wusan-ai.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/wusan-ai-store/current/dist;
    index index.html;
    client_max_body_size 32k;

    # 包含支付宝通知。保留 POST 请求体及后端的纯文本响应。
    location /api/ {
        proxy_pass http://127.0.0.1:5182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
